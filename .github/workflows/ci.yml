name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.2 uvicorn==0.30.6 pydantic==2.9.2 SQLAlchemy==2.0.35 \
            openai==3.13.0 pytest==8.3.3 httpx==0.27.2 ruff==0.6.9
      - name: Lint
        run: ruff check app tests infra
      - name: Testes
        run: pytest -q

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
